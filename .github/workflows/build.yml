name: build images

# Builds the same Debian trixie armhf rootfs in two flavours:
#   pocketchip - awesome + pocketchip-menu home screen, PICO-8, SunVox
#   desktop    - XFCE on the CHIP HDMI adapter
# Both produce a USB/FEL-bootable ext4 image plus the U-Boot binary and DTBs
# needed to boot it.

on:
  workflow_dispatch:
    inputs:
      variant:
        description: Which image to build
        type: choice
        options:
          - both
          - pocketchip
          - desktop
        default: both
      with_nand:
        description: Also build the experimental NAND SLC installer (PocketCHIP)
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  POCKETCHIP_TIMEZONE: ${{ vars.POCKETCHIP_TIMEZONE || 'Asia/Shanghai' }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - id: matrix
        env:
          VARIANT: ${{ inputs.variant }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "workflow_dispatch" ] || [ "${VARIANT:-both}" = "both" ]; then
            echo 'value={"include":[{"variant":"pocketchip"},{"variant":"desktop"}]}' >> "$GITHUB_OUTPUT"
          else
            printf 'value={"include":[{"variant":"%s"}]}\n' "$VARIANT" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      VARIANT: ${{ matrix.variant }}
      UPSTREAMS_DIR: ${{ github.workspace }}/../upstreams
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            /usr/share/swift
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            arch-test bc binfmt-support bison build-essential curl \
            device-tree-compiler e2fsprogs flex gcc-arm-linux-gnueabihf git \
            gnupg libgnutls28-dev \
            libssl-dev make mmdebstrap openssl python3 python3-pil qemu-user-static \
            rsync sunxi-tools swig u-boot-tools unzip util-linux xz-utils zstd

      - name: Enable armhf binfmt
        run: |
          sudo update-binfmts --enable qemu-arm 2>/dev/null || true
          if ! grep -qs enabled /proc/sys/fs/binfmt_misc/qemu-arm; then
            test -x /usr/bin/qemu-arm-static
            printf ':qemu-arm:M::\x7fELF\x01\x01\x01\x00\x00\x00\x00\x00\x00\x00\x00\x00\x02\x00\x28\x00:\xff\xff\xff\xff\xff\xff\xff\x00\xff\xff\xff\xff\xff\xff\xff\xff\xfe\xff\xff\xff:/usr/bin/qemu-arm-static:F' \
              | sudo tee /proc/sys/fs/binfmt_misc/register >/dev/null
          fi
          cat /proc/sys/fs/binfmt_misc/qemu-arm
          sudo ./scripts/check-host.sh || true

      - name: Cache upstream checkouts
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/../upstreams
          key: upstreams-v2-${{ hashFiles('scripts/fetch-upstreams.sh', 'scripts/build-mainline-uboot.sh') }}

      - name: Fetch upstreams
        run: ./scripts/fetch-upstreams.sh

      - name: Build mainline U-Boot
        run: ./scripts/build-mainline-uboot.sh

      - name: Build device tree
        run: |
          if [ "$VARIANT" = pocketchip ]; then
            ./scripts/build-pocketchip-dtbo.sh
          else
            SOURCE_DTSO="$PWD/dts/chip-hdmi.dts" \
            OUT_DTBO="$PWD/build/dtbo/dip-hdmi.dtbo" \
            OUT_DTB="$PWD/build/dtbo/sun5i-r8-chip-hdmi.dtb" \
              ./scripts/build-pocketchip-dtbo.sh
          fi

      - name: Prepare variant extras
        run: ./scripts/variants/prepare-extras.sh "$VARIANT" "$PWD/build/extras"

      - name: Build rootfs
        run: |
          extra="$(grep -vE '^[[:space:]]*(#|$)' "configs/variants/${VARIANT}.packages" | tr '\n' ' ')"
          sudo env \
            POCKETCHIP_EXTRA_PACKAGES="$extra" \
            POCKETCHIP_EXTRAS_DIR="$PWD/build/extras" \
            POCKETCHIP_POST_INSTALL="$PWD/scripts/variants/${VARIANT}-post-install.sh" \
            POCKETCHIP_TIMEZONE="$POCKETCHIP_TIMEZONE" \
            POCKETCHIP_IMAGE_PROFILE=balanced \
            ./scripts/build-rootfs.sh

      - name: Build USB image
        run: |
          image="$PWD/build/images/${VARIANT}-debian-trixie-armhf.img"
          if [ "$VARIANT" = pocketchip ]; then
            sudo env SIZE_MB=4096 FORCE=1 IMAGE="$image" \
              DTBO="$PWD/build/dtbo/pocketchip-v73-mainline.dtbo" \
              MERGED_DTB="$PWD/build/dtbo/sun5i-r8-pocketchip.dtb" \
              DTB_NAME=sun5i-r8-pocketchip.dtb \
              MENU_LABEL="Debian trixie PocketCHIP" \
              ./scripts/build-usb-image.sh
          else
            sudo env SIZE_MB=4096 FORCE=1 IMAGE="$image" \
              DTBO="$PWD/build/dtbo/absent.dtbo" \
              MERGED_DTB="$PWD/build/dtbo/sun5i-r8-chip-hdmi.dtb" \
              DTB_NAME=sun5i-r8-chip-hdmi.dtb \
              MENU_LABEL="Debian trixie Desktop CHIP (HDMI)" \
              ./scripts/build-usb-image.sh
          fi

      - name: Install NAND host tooling
        if: matrix.variant == 'pocketchip' && inputs.with_nand
        run: |
          sudo apt-get install -y --no-install-recommends \
            android-sdk-libsparse-utils autoconf automake gcc-arm-linux-gnueabi \
            liblzo2-dev libtool mtd-utils pkg-config ripgrep uuid-dev zlib1g-dev

      - name: Build NAND host tools
        if: matrix.variant == 'pocketchip' && inputs.with_nand
        run: |
          ./scripts/build-sunxi-tools-misc.sh
          ./scripts/build-chip-mtd-utils.sh

      - name: Build legacy NAND U-Boot
        if: matrix.variant == 'pocketchip' && inputs.with_nand
        run: make uboot-legacy-mlc-pc-slc

      - name: Build NAND SLC installer image
        if: matrix.variant == 'pocketchip' && inputs.with_nand
        run: sudo make nand-image-mlc-pc-slc

      - name: Upload NAND installer
        if: matrix.variant == 'pocketchip' && inputs.with_nand
        uses: actions/upload-artifact@v4
        with:
          name: nand-pocketchip
          path: build/nand-slc/images
          retention-days: 14

      - name: Compress image
        run: |
          sudo chown -R "$(id -u):$(id -g)" build/images
          image="$(find build/images -maxdepth 1 -name '*.img' -print -quit)"
          zstd -T0 -19 -q --rm "$image"
          (cd "$(dirname "$image")" && sha256sum "$(basename "$image").zst" > "$(basename "$image").zst.sha256")
          ls -lh build/images

      - name: Upload boot artifacts
        uses: actions/upload-artifact@v4
        with:
          name: boot-${{ matrix.variant }}
          path: |
            build/u-boot-mainline/u-boot-sunxi-with-spl.bin
            build/dtbo/*.dtb
            build/dtbo/*.dtbo
          if-no-files-found: warn
          retention-days: 14

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.variant }}
          path: |
            build/images/*.img.zst
            build/images/*.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/images/*.img.zst
            build/images/*.sha256
            build/u-boot-mainline/u-boot-sunxi-with-spl.bin
