# Trim documentation and translations while packages are installed. The
# copyright files stay so the image remains redistributable, and English plus
# the two Chinese locales are kept because the PocketCHIP UI targets them.
# build-rootfs.sh removes this file before packaging so installs on the running
# device behave normally again.
path-exclude=/usr/share/doc/*
path-include=/usr/share/doc/*/copyright
path-exclude=/usr/share/locale/*
path-include=/usr/share/locale/en*
path-include=/usr/share/locale/zh_CN*
path-include=/usr/share/locale/zh_TW*
path-include=/usr/share/locale/locale.alias
